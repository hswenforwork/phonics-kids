# 處理家長模式表單頁送出的申請單（新增或修改單字、修改聲音表），寫進 data/*.csv 後同步
# 安全：只處理 repo 擁有者自己開的申請單，其他人開的一律忽略
name: 單字申請單

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: phonics-data
  cancel-in-progress: false

jobs:
  process:
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.body, 'pk-action:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 準備剪音工具
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 -c "import numpy" 2>/dev/null || pip install -q numpy

      - name: 寫進表單
        id: words
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          RESULT_FILE: ${{ runner.temp }}/result.md
        run: node scripts/process-issue.cjs

      - name: 同步表單
        if: success()
        env:
          SYNC_REPORT: ${{ runner.temp }}/result.md
        run: node scripts/sync-sheet.cjs

      - name: 產生語音檔
        if: success()
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
        run: node scripts/build-audio.cjs

      - name: 存檔並推送
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data audio
          if git diff --cached --quiet; then echo "沒有變更"; else git commit -m "申請單 #${{ github.event.issue.number }}：更新單字表單" && (git push || (git pull --rebase && git push)); fi

      - name: 回覆並關閉申請單
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_FILE: ${{ runner.temp }}/result.md
        run: |
          if [ ! -f "$RESULT_FILE" ]; then echo "❌ 處理失敗，請查看 Actions 紀錄。" > "$RESULT_FILE"; fi
          echo "" >> "$RESULT_FILE"
          echo "_網站約 1～3 分鐘後更新；若畫面沒變，請重新整理頁面。_" >> "$RESULT_FILE"
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file "$RESULT_FILE"
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"
