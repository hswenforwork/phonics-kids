# 單字表單更新時自動同步：改了 data/ 裡的三張 CSV，或在 custom/ 上傳／刪除了音檔、圖片
# 同步後自動產生新字的 AI 語音，網站約 1～3 分鐘後更新；也可以在 Actions 頁面手動按「Run workflow」
name: 同步單字表單

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/words.csv
      - data/sounds.csv
      - data/exceptions.csv
      - custom/**
      - scripts/sync-sheet.cjs

permissions:
  contents: write

concurrency:
  group: phonics-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 準備轉檔與剪音工具
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 -c "import numpy" 2>/dev/null || pip install -q numpy
      - name: 同步表單
        run: node scripts/sync-sheet.cjs
      - name: 產生新字的 AI 語音
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
        run: node scripts/build-audio.cjs
      - name: 存檔並推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data audio
          if git diff --cached --quiet; then echo "沒有變更"; else git commit -m "同步單字表單" && (git push || (git pull --rebase && git push)); fi
